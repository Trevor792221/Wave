name: Tag and release

# Each app has its own version in app/build.gradle.kts: Wave for TV (tags v<version>) and Wave
# Mobile (tags mobile-v<version>). When a change to that file lands on main, for each app:
#   1. create its tag if it doesn't exist yet
#   2. if that version has no release yet: build the signed APK from the tag and publish it
#   3. update the app's fixed download link (the README's download buttons) to its newest APK
# An app whose version didn't change isn't rebuilt. Run it manually (Actions tab) to retry.
on:
  push:
    branches: [main]
    paths: ["app/build.gradle.kts"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - app: tv
            name: Wave
            prefix: v
            apk: wave
            task: assembleTvRelease
          - app: mobile
            name: Wave Mobile
            prefix: mobile-v
            apk: wave-mobile
            task: assembleMobileRelease
    env:
      APP: ${{ matrix.app }}
      NAME: ${{ matrix.name }}
      APK_NAME: ${{ matrix.apk }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version, tag and release check
        id: v
        run: |
          version=$(sed -n '/create("'"$APP"'")/,/}/s/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$version" ]; then
            echo "No versionName for $APP in app/build.gradle.kts" >&2
            exit 1
          fi
          tag="${{ matrix.prefix }}$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "$NAME $version"
            git push origin "$tag"
            echo "Created tag $tag" >> "$GITHUB_STEP_SUMMARY"
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$NAME $version is already released." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the tag
        if: steps.v.outputs.skip != 'true'
        run: git checkout "$TAG"

      - uses: actions/setup-java@v4
        if: steps.v.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode signing key
        if: steps.v.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.WAVE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret WAVE_KEYSTORE_BASE64 is not set." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wave-release.p12"
          echo "WAVE_KEYSTORE_FILE=$RUNNER_TEMP/wave-release.p12" >> "$GITHUB_ENV"

      - name: Build the signed APK
        if: steps.v.outputs.skip != 'true'
        env:
          WAVE_KEYSTORE_PASSWORD: ${{ secrets.WAVE_KEYSTORE_PASSWORD }}
          WAVE_KEY_ALIAS: ${{ secrets.WAVE_KEY_ALIAS }}
          WAVE_KEY_PASSWORD: ${{ secrets.WAVE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon ${{ matrix.task }}

      - name: Verify the APK signature
        if: steps.v.outputs.skip != 'true'
        run: |
          apk="app/build/outputs/apk/$APP/release/$APK_NAME-$VERSION.apk"
          test -f "$apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify --print-certs "$apk" | tee cert.txt
          if grep -q "CN=Android Debug" cert.txt; then
            echo "$apk is signed with a debug key, not the release key." >&2
            exit 1
          fi
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Publish the release
        if: steps.v.outputs.skip != 'true'
        run: |
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$NAME $VERSION" \
            --notes "$NAME $VERSION. Install \`$(basename "$APK")\`."
          echo "Published $NAME $VERSION ($TAG)" >> "$GITHUB_STEP_SUMMARY"

      - name: Update the download link
        run: |
          # A fixed release per app (latest-tv / latest-mobile) holds its newest APK under a fixed
          # name, so the README's download buttons always point at the newest version.
          mkdir -p "$RUNNER_TEMP/dl"
          file="$RUNNER_TEMP/dl/$APK_NAME.apk"
          if [ -n "$APK" ] && [ -f "$APK" ]; then
            cp "$APK" "$file"
          else
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$APK_NAME-$VERSION.apk" --output "$file"
          fi
          dl="latest-$APP"
          if ! gh release view "$dl" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$dl" --repo "$GITHUB_REPOSITORY" --target main --prerelease --latest=false \
              --title "$NAME: newest download" \
              --notes "Always holds the newest $NAME as \`$APK_NAME.apk\` (the README's download button). Versioned releases are listed separately."
          fi
          gh release upload "$dl" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Download link now serves $NAME $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/wave-release.p12"
